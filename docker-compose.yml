# Production-like local stack. Migrations run as a separate step (see the
# deploy workflow), never on app start.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime
      POSTGRES_DB: prime_agentic
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'prime']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://prime:prime@postgres:5432/prime_agentic?schema=public
      EMAIL_PROVIDER: console
      SALES_INBOX_EMAIL: ''
      CORS_ORIGIN: http://localhost:3000
      TRUST_PROXY_HOPS: '1'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
