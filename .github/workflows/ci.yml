name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime
          POSTGRES_DB: prime_agentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prime-agentic/contracts build
      - run: npx playwright install --with-deps chromium
      # API vitest e2e spins up its own Postgres via Testcontainers (Docker on runner).
      - name: API e2e (Testcontainers)
        run: pnpm --dir apps/api test:e2e
      # Full-stack: migrate the service DB, start the API with fake adapters, run Playwright.
      - name: Migrate, start API, run web e2e
        env:
          DATABASE_URL: postgresql://prime:prime@localhost:5432/prime_agentic?schema=public
          EMAIL_PROVIDER: console
          NODE_ENV: test
          PORT: '3001'
          NEXT_PUBLIC_API_URL: http://localhost:3001
          FULL_STACK: '1'
        run: |
          set -euo pipefail
          pnpm --dir apps/api build
          pnpm --dir apps/api prisma migrate deploy
          node apps/api/dist/main.js &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fs http://localhost:3001/health && break
            sleep 2
          done
          pnpm --dir apps/web test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  lighthouse:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI (mobile + desktop, median of 3)
        run: |
          set -euo pipefail
          pnpm --dir apps/web start &
          WEB_PID=$!
          trap 'kill $WEB_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fs http://localhost:3000/ && break
            sleep 2
          done
          npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.js
          npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.desktop.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
