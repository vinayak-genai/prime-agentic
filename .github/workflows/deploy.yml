name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Required reviewers are configured on the GitHub Environment itself.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The API image is host-agnostic (runtime env config), so it is built
      # once and the same image is promoted across environments.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t prime-agentic-api:${{ github.sha }} .

      # NEXT_PUBLIC_* are baked at build time, so the web image is built per
      # environment with the matching build-args from the environment secrets.
      - name: Build web image
        env:
          API_URL: ${{ secrets[format('{0}_API_URL', inputs.environment)] }}
          SITE_URL: ${{ secrets[format('{0}_SITE_URL', inputs.environment)] }}
          TURNSTILE_SITE_KEY: ${{ secrets[format('{0}_TURNSTILE_SITE_KEY', inputs.environment)] }}
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            -t prime-agentic-web:${{ inputs.environment }}-${{ github.sha }} .

      # TODO(host): push both images to the chosen registry (GHCR/ECR/GCR/…).
      - name: Push images
        run: |
          echo "TODO: docker push the api and web images"

      # TODO(host): run Prisma migrations as a separate deploy step.
      - name: Run migrations
        run: |
          echo "TODO: prisma migrate deploy against the target database"

      # TODO(host): deploy to the chosen host (Render / Fly / K8s / …).
      - name: Deploy
        run: |
          echo "TODO: deploy ${{ inputs.environment }}"
